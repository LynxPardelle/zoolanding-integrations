  StripeWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-stripe-webhook
      CodeUri: src/
      Handler: handlers.stripe_webhook.lambda_handler
      Description: Verifies and durably admits allowlisted Stripe Connect events.
      ReservedConcurrentExecutions:
        Ref: StripeWebhookReservedConcurrency
      Role:
        Fn::GetAtt: [StripeWebhookRole, Arn]
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: StripeWebhookLogGroup
      Environment:
        Variables:
          WEBHOOK_RECEIPT_TABLE_NAME:
            Ref: WebhookReceiptTable
      Events:
        StripeConnectWebhook:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /webhooks/stripe/connect
            Method: post

  SubscriptionMigrationWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.subscription_migration_worker.lambda_handler
      Description: Applies claimed draft-scoped subscription migration work.
      Role:
        Fn::GetAtt: [SubscriptionMigrationWorkerRole, Arn]
      Timeout: 30
      ReservedConcurrentExecutions: 5
      Environment:
        Variables:
          MIGRATION_WORK_QUEUE_URL:
            Ref: SubscriptionMigrationWorkQueue
          WEBHOOK_RECEIPT_TABLE_NAME:
            Ref: WebhookReceiptTable
      LoggingConfig: *ControlPlaneLogging
      Events:
        MigrationWork:
          Type: SQS
          Properties:
            Queue:
              Fn::GetAtt: [SubscriptionMigrationWorkQueue, Arn]
            BatchSize: 1
            FunctionResponseTypes:
              - ReportBatchItemFailures
            ScalingConfig:
              MaximumConcurrency: 5

  WebhookIngressStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-webhook-ingress-stream
      CodeUri: src/
      Handler: handlers.stripe_event_worker.lambda_handler
      Description: Re-fetches canonical Stripe state and commits closed Commerce events.
      Role:
        Fn::GetAtt:
          - WebhookIngressStreamRole
          - Arn
      Environment:
        Variables:
          WEBHOOK_RECEIPT_TABLE_NAME:
            Ref: WebhookReceiptTable
          MIGRATION_WORK_QUEUE_URL:
            Ref: SubscriptionMigrationWorkQueue
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: WebhookIngressLogGroup
      Events:
        PendingIngress:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
                - WebhookReceiptTable
                - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 5
            MaximumRecordAgeInSeconds: 3600
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"itemType":{"S":["WebhookIngressOutbox"]},"processingStatus":{"S":["pending"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                    - WebhookIngressFailureQueue
                    - Arn

  IntegrationOutgoingStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-integration-outgoing-stream
      CodeUri: src/
      Handler: handlers.integration_outbox_relay.lambda_handler
      Description: Relays closed Integration Events to the scoped SNS topic.
      Role:
        Fn::GetAtt:
          - IntegrationOutgoingStreamRole
          - Arn
      Environment:
        Variables:
          WEBHOOK_RECEIPT_TABLE_NAME:
            Ref: WebhookReceiptTable
          INTEGRATION_EVENTS_TOPIC_ARN:
            Ref: IntegrationEventsTopic
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: IntegrationOutgoingLogGroup
      Events:
        PendingOutgoing:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
                - WebhookReceiptTable
                - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 5
            MaximumRecordAgeInSeconds: 3600
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"itemType":{"S":["IntegrationEventOutbox"]},"deliveryStatus":{"S":["pending"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                    - IntegrationOutgoingFailureQueue
                    - Arn

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Integrations API returned a server error.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value:
            Fn::Sub: ${AWS::StackName}-api
        - Name: Stage
          Value:
            Ref: EnvironmentName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - Ref: AlarmTopicArn

