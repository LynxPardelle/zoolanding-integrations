AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding generic draft-scoped Integrations foundation.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - test
      - production
  ConfigRegistryTableName:
    Type: String
    MinLength: 3
  ConfigPayloadsBucketName:
    Type: String
    MinLength: 3
  AuthSessionTableName:
    Type: String
    MinLength: 3
  AuthUserStateTableName:
    Type: String
    MinLength: 3
  InternalCallerArns:
    Type: String
    MinLength: 20

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        ENVIRONMENT_NAME:
          Ref: EnvironmentName
        INTERNAL_CALLER_ARNS:
          Ref: InternalCallerArns
        CONFIG_REGISTRY_TABLE_NAME:
          Ref: ConfigRegistryTableName
        CONFIG_PAYLOADS_BUCKET_NAME:
          Ref: ConfigPayloadsBucketName
        AUTH_SESSION_TABLE_NAME:
          Ref: AuthSessionTableName
        AUTH_USER_STATE_TABLE_NAME:
          Ref: AuthUserStateTableName
        INTEGRATION_REGISTRY_TABLE_NAME:
          Ref: IntegrationRegistryTable

Resources:
  IntegrationRegistryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: IntegrationsRegistry
        - Key: Environment
          Value:
            Ref: EnvironmentName

  WebhookReceiptTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: IntegrationWebhookReceipts
        - Key: Environment
          Value:
            Ref: EnvironmentName

  WebhookIngressFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IntegrationOutgoingFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IntegrationEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: IntegrationEvents
        - Key: Environment
          Value:
            Ref: EnvironmentName

  IntegrationApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName:
        Ref: EnvironmentName
      EndpointConfiguration: REGIONAL

  ControlPlaneLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-control-plane
      RetentionInDays: 30

  ControlPlaneLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              Fn::Sub: ${ControlPlaneLogGroup.Arn}:*

  PublishedPolicyReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
              Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*

  AuthAdminReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
              - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}

  IntegrationRegistryReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
            Resource:
              Fn::GetAtt:
                - IntegrationRegistryTable
                - Arn

  BrowserReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: AuthAdminReadPolicy
        - Ref: IntegrationRegistryReadPolicy

  BrowserActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: AuthAdminReadPolicy
        - Ref: IntegrationRegistryReadPolicy
      Policies:
        - PolicyName: UpdateConnectionState
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:UpdateItem
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn

  StripeOnboardingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: AuthAdminReadPolicy
        - Ref: IntegrationRegistryReadPolicy
      Policies:
        - PolicyName: StripeOnboardingStateAndCredential
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/*/*/stripe/*

  ConnectionAdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: IntegrationRegistryReadPolicy
      Policies:
        - PolicyName: RegisterConnectionMetadata
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn
              - Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/*

  InternalConnectionResolveRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: IntegrationRegistryReadPolicy

  InternalProviderCommandRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: IntegrationRegistryReadPolicy
        - Ref: PublishedPolicyReadPolicy
      Policies:
        - PolicyName: ScopedProviderCommands
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/*/*/stripe/*

  InternalMigrationBoundaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy

  WebhookIngressLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-webhook-ingress-stream
      RetentionInDays: 30

  IntegrationOutgoingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-integration-outgoing-stream
      RetentionInDays: 30

  WebhookIngressStreamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntegrationsWebhookIngressStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  Fn::GetAtt:
                    - WebhookReceiptTable
                    - StreamArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - WebhookIngressFailureQueue
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-webhook-ingress-stream:*

  IntegrationOutgoingStreamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntegrationsOutgoingStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  Fn::GetAtt:
                    - WebhookReceiptTable
                    - StreamArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - IntegrationOutgoingFailureQueue
                    - Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-integration-outgoing-stream:*

  ConnectionReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.connection_read.lambda_handler
      Role:
        Fn::GetAtt:
          - BrowserReadRole
          - Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        BrowserRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /features/integrations/read
            Method: post

  ConnectionActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.connection_action.lambda_handler
      Role:
        Fn::GetAtt:
          - BrowserActionRole
          - Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        BrowserAction:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /features/integrations/action
            Method: post

  StripeOnboardingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.stripe_onboarding.lambda_handler
      Role:
        Fn::GetAtt:
          - StripeOnboardingRole
          - Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        StripeOnboarding:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /features/integrations/stripe/onboarding
            Method: post

  InternalStripeOfferFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_offer.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: &ControlPlaneLogging
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        InternalCommand:
          Type: Api
          Properties: &InternalStripeOfferEvent
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/offer
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeProductPresentationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_product_presentation.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/product-presentation
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeDiscountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_discount.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/discount
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeDiscountLifecycleFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_discount_lifecycle.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/discount-lifecycle
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeCheckoutFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_checkout.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/checkout
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeCheckoutStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_checkout_status.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/checkout-status
            Method: get
            Auth:
              Authorizer: AWS_IAM

  InternalStripeSubscriptionChangeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_subscription_change.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/subscription/change
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeSubscriptionDiscountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_subscription_discount.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/subscription/discount
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeSubscriptionPauseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_subscription_pause.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/subscription/pause
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeCustomerPortalFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_customer_portal.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/customer-portal
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeMigrationsPreviewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_migrations_preview.lambda_handler
      Role:
        Fn::GetAtt: [InternalMigrationBoundaryRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/migrations/preview
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeMigrationsExecuteFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_migrations_execute.lambda_handler
      Role:
        Fn::GetAtt: [InternalMigrationBoundaryRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/migrations/execute
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeMigrationsControlFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_migrations_control.lambda_handler
      Role:
        Fn::GetAtt: [InternalMigrationBoundaryRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/migrations/control
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeMigrationsStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_migrations_status.lambda_handler
      Role:
        Fn::GetAtt: [InternalMigrationBoundaryRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/migrations/status
            Method: get
            Auth:
              Authorizer: AWS_IAM

  InternalConnectionRegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_connection_register.lambda_handler
      Role:
        Fn::GetAtt: [ConnectionAdminRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/integrations/connection-register
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalConnectionResolveFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_connection_resolve.lambda_handler
      Role:
        Fn::GetAtt: [InternalConnectionResolveRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/integrations/connection-resolve
            Method: post
            Auth:
              Authorizer: AWS_IAM

  WebhookIngressStreamFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - WebhookIngressLogGroup
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-webhook-ingress-stream
      CodeUri: src/
      Handler: handlers.pending_stream.lambda_handler
      Description: Fails closed until verified webhook event processing is implemented.
      Role:
        Fn::GetAtt:
          - WebhookIngressStreamRole
          - Arn
      Environment:
        Variables:
          STREAM_KIND: ingress
      Events:
        PendingIngress:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
                - WebhookReceiptTable
                - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 5
            MaximumRecordAgeInSeconds: 3600
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"itemType":{"S":["WebhookIngressOutbox"]},"processingStatus":{"S":["pending"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                    - WebhookIngressFailureQueue
                    - Arn

  IntegrationOutgoingStreamFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - IntegrationOutgoingLogGroup
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-integration-outgoing-stream
      CodeUri: src/
      Handler: handlers.pending_stream.lambda_handler
      Description: Fails closed until verified Integration Events relay is implemented.
      Role:
        Fn::GetAtt:
          - IntegrationOutgoingStreamRole
          - Arn
      Environment:
        Variables:
          STREAM_KIND: outgoing
      Events:
        PendingOutgoing:
          Type: DynamoDB
          Properties:
            Stream:
              Fn::GetAtt:
                - WebhookReceiptTable
                - StreamArn
            StartingPosition: LATEST
            BatchSize: 10
            BisectBatchOnFunctionError: true
            MaximumRetryAttempts: 5
            MaximumRecordAgeInSeconds: 3600
            FunctionResponseTypes:
              - ReportBatchItemFailures
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT","MODIFY"],"dynamodb":{"NewImage":{"itemType":{"S":["IntegrationEventOutbox"]},"deliveryStatus":{"S":["pending"]}}}}'
            DestinationConfig:
              OnFailure:
                Type: SQS
                Destination:
                  Fn::GetAtt:
                    - IntegrationOutgoingFailureQueue
                    - Arn

Outputs:
  IntegrationRegistryTableName:
    Value:
      Ref: IntegrationRegistryTable
  WebhookReceiptTableName:
    Value:
      Ref: WebhookReceiptTable
  IntegrationEventsTopicArn:
    Value:
      Ref: IntegrationEventsTopic
