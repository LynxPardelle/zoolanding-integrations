AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Zoolanding generic draft-scoped Integrations foundation.

Parameters:
  EnvironmentName:
    Type: String
    AllowedValues:
      - test
      - production
  ConfigRegistryTableName:
    Type: AWS::SSM::Parameter::Value<String>
  ConfigPayloadsBucketName:
    Type: AWS::SSM::Parameter::Value<String>
  AuthSessionTableName:
    Type: AWS::SSM::Parameter::Value<String>
  AuthUserStateTableName:
    Type: AWS::SSM::Parameter::Value<String>
  InternalCallerArns:
    Type: String
    Default: ''
    AllowedPattern: '^(?:arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+(?:,arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)*)?$'
  SmtpTestSharedAccountClaimHash:
    Type: String
    AllowedPattern: '^[a-f0-9]{64}$'
    NoEcho: true
  SmtpActivationCallerArns:
    Type: String
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+(?:,arn:(aws|aws-us-gov|aws-cn):iam::[0-9]{12}:role/[A-Za-z0-9+=,.@_/-]+)*$'
  AlarmTopicArn:
    Type: String
    AllowedPattern: '^arn:(aws|aws-us-gov|aws-cn):sns:[a-z0-9-]+:[0-9]{12}:[A-Za-z0-9_.-]+$'
  StripeWebhookRateLimit:
    Type: Number
    MinValue: 1
    MaxValue: 100
  StripeWebhookBurstLimit:
    Type: Number
    MinValue: 1
    MaxValue: 200
  StripeWebhookReservedConcurrency:
    Type: Number
    MinValue: 1
    MaxValue: 20

Globals:
  Function:
    Runtime: python3.13
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 10
    Environment:
      Variables:
        ENVIRONMENT_NAME:
          Ref: EnvironmentName
        INTERNAL_CALLER_ARNS:
          Ref: InternalCallerArns
        CONFIG_REGISTRY_TABLE_NAME:
          Ref: ConfigRegistryTableName
        CONFIG_PAYLOADS_BUCKET_NAME:
          Ref: ConfigPayloadsBucketName
        AUTH_SESSION_TABLE_NAME:
          Ref: AuthSessionTableName
        AUTH_USER_STATE_TABLE_NAME:
          Ref: AuthUserStateTableName
        INTEGRATION_REGISTRY_TABLE_NAME:
          Ref: IntegrationRegistryTable

Resources:
  IntegrationRegistryTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: migrationWorkPk
          AttributeType: S
        - AttributeName: migrationWorkSk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: MigrationWorkIndex
          KeySchema:
            - AttributeName: migrationWorkPk
              KeyType: HASH
            - AttributeName: migrationWorkSk
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: IntegrationsRegistry
        - Key: Environment
          Value:
            Ref: EnvironmentName

  WebhookReceiptTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: IntegrationWebhookReceipts
        - Key: Environment
          Value:
            Ref: EnvironmentName

  WebhookIngressFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  IntegrationOutgoingFailureQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SubscriptionMigrationDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  SubscriptionMigrationWorkQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      VisibilityTimeout: 180
      RedrivePolicy:
        deadLetterTargetArn:
          Fn::GetAtt: [SubscriptionMigrationDeadLetterQueue, Arn]
        maxReceiveCount: 5

  IntegrationEventsTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: Project
          Value: Zoolandingpage
        - Key: Component
          Value: IntegrationEvents
        - Key: Environment
          Value:
            Ref: EnvironmentName

  IntegrationEventsTopicArnParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/topics/integration-events-arn
      Type: String
      Value:
        Ref: IntegrationEventsTopic
      Description: Published ARN for the Integrations event topic.

  IntegrationApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-api
      StageName:
        Ref: EnvironmentName
      EndpointConfiguration: REGIONAL
      MethodSettings:
        - ResourcePath: /~1webhooks~1stripe~1connect
          HttpMethod: POST
          MetricsEnabled: true
          ThrottlingRateLimit:
            Ref: StripeWebhookRateLimit
          ThrottlingBurstLimit:
            Ref: StripeWebhookBurstLimit

  IntegrationApiIdParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name:
        Fn::Sub: /zoolanding/${EnvironmentName}/services/integrations/api-id
      Type: String
      Value:
        Ref: IntegrationApi
      Description: Published API identifier for trusted service composition.

  ControlPlaneLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-control-plane
      RetentionInDays: 30

  ControlPlaneLoggingPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              Fn::Sub: ${ControlPlaneLogGroup.Arn}:*

  PublishedPolicyReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
              Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/integration-bindings.json

  PublishedAuthProfileReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/auth-profile-registry.json

  PublishedCommercePolicyReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
              Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ConfigRegistryTableName}
          - Effect: Allow
            Action: s3:GetObject
            Resource:
              Fn::Sub: arn:${AWS::Partition}:s3:::${ConfigPayloadsBucketName}/sites/*/versions/*/*/server/commerce.json

  AuthAdminReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: dynamodb:GetItem
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthSessionTableName}
              - Fn::Sub: arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${AuthUserStateTableName}

  IntegrationRegistryReadPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:Query
            Resource:
              - Fn::GetAtt:
                  - IntegrationRegistryTable
                  - Arn

  BrowserReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: PublishedAuthProfileReadPolicy
        - Ref: AuthAdminReadPolicy
        - Ref: IntegrationRegistryReadPolicy

  BrowserActionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: PublishedAuthProfileReadPolicy
        - Ref: AuthAdminReadPolicy
        - Ref: IntegrationRegistryReadPolicy
      Policies:
        - PolicyName: UpdateConnectionState
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn

  StripeOnboardingRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: PublishedAuthProfileReadPolicy
        - Ref: AuthAdminReadPolicy
        - Ref: IntegrationRegistryReadPolicy
      Policies:
        - PolicyName: StripeOnboardingStateAndCredential
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/stripe/connect-platform-??????

  ConnectionAdminRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: PublishedPolicyReadPolicy
        - Ref: IntegrationRegistryReadPolicy
      Policies:
        - PolicyName: RegisterConnectionMetadata
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn
              - Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/stripe/connect-platform-??????
                  - Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/*/*/notifications/smtp/*-??????

  InternalConnectionResolveRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: IntegrationRegistryReadPolicy

  SmtpConnectionActivationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
      Policies:
        - PolicyName: ActivateSmtpConnectionMetadata
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn
              - Effect: Allow
                Action: secretsmanager:DescribeSecret
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/*/*/notifications/smtp/*-??????

  InternalProviderCommandRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: IntegrationRegistryReadPolicy
        - Ref: PublishedCommercePolicyReadPolicy
      Policies:
        - PolicyName: ScopedProviderCommands
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt:
                    - IntegrationRegistryTable
                    - Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/stripe/connect-platform-??????

  InternalMigrationBoundaryRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
      Policies:
        - PolicyName: ScopedMigrationCommands
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt: [IntegrationRegistryTable, Arn]
                  - Fn::GetAtt: [WebhookReceiptTable, Arn]
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - Fn::GetAtt: [IntegrationRegistryTable, Arn]
                  - Fn::Sub: ${IntegrationRegistryTable.Arn}/index/MigrationWorkIndex
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::GetAtt: [SubscriptionMigrationWorkQueue, Arn]

  InternalMigrationStatusRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
        - Ref: IntegrationRegistryReadPolicy

  SubscriptionMigrationWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - Ref: ControlPlaneLoggingPolicy
      Policies:
        - PolicyName: ScopedSubscriptionMigrationWork
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt: [IntegrationRegistryTable, Arn]
                  - Fn::GetAtt: [WebhookReceiptTable, Arn]
              - Effect: Allow
                Action: dynamodb:Query
                Resource:
                  - Fn::GetAtt: [IntegrationRegistryTable, Arn]
                  - Fn::Sub: ${IntegrationRegistryTable.Arn}/index/MigrationWorkIndex
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:SendMessage
                Resource:
                  Fn::GetAtt: [SubscriptionMigrationWorkQueue, Arn]
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/stripe/connect-platform-??????

  WebhookIngressLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-webhook-ingress-stream
      RetentionInDays: 30

  StripeWebhookLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-stripe-webhook
      RetentionInDays: 30

  IntegrationOutgoingLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName:
        Fn::Sub: /aws/lambda/${AWS::StackName}-integration-outgoing-stream
      RetentionInDays: 30

  StripeWebhookRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: StripeWebhookIngress
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-stripe-webhook:*
              - Effect: Allow
                Action: dynamodb:GetItem
                Resource:
                  Fn::GetAtt: [IntegrationRegistryTable, Arn]
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:TransactWriteItems
                Resource:
                  Fn::GetAtt: [WebhookReceiptTable, Arn]
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/stripe/connect-webhook-??????

  WebhookIngressStreamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntegrationsWebhookIngressStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  Fn::GetAtt:
                    - WebhookReceiptTable
                    - StreamArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  - Fn::GetAtt:
                      - WebhookIngressFailureQueue
                      - Arn
                  - Fn::GetAtt:
                      - SubscriptionMigrationWorkQueue
                      - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - Fn::GetAtt: [WebhookReceiptTable, Arn]
                  - Fn::GetAtt: [IntegrationRegistryTable, Arn]
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:/zoolanding/${EnvironmentName}/integrations/stripe/connect-platform-??????
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-webhook-ingress-stream:*

  IntegrationOutgoingStreamRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: IntegrationsOutgoingStream
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource:
                  Fn::GetAtt:
                    - WebhookReceiptTable
                    - StreamArn
              - Effect: Allow
                Action: sqs:SendMessage
                Resource:
                  Fn::GetAtt:
                    - IntegrationOutgoingFailureQueue
                    - Arn
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                Resource:
                  Fn::GetAtt: [WebhookReceiptTable, Arn]
              - Effect: Allow
                Action: sns:Publish
                Resource:
                  Ref: IntegrationEventsTopic
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-integration-outgoing-stream:*

  ConnectionReadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.connection_read.lambda_handler
      Role:
        Fn::GetAtt:
          - BrowserReadRole
          - Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        BrowserRead:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /features/integrations/read
            Method: post

  ConnectionActionFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.connection_action.lambda_handler
      Role:
        Fn::GetAtt:
          - BrowserActionRole
          - Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        BrowserAction:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /features/integrations/action
            Method: post

  StripeOnboardingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.stripe_onboarding.lambda_handler
      Role:
        Fn::GetAtt:
          - StripeOnboardingRole
          - Arn
      LoggingConfig:
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        StripeOnboarding:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /features/integrations/stripe/onboarding
            Method: post

  InternalStripeOfferFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_offer.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: &ControlPlaneLogging
        LogFormat: JSON
        LogGroup:
          Ref: ControlPlaneLogGroup
      Events:
        InternalCommand:
          Type: Api
          Properties: &InternalStripeOfferEvent
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/offer
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeProductPresentationFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_product_presentation.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
          Type: Api
          Properties:
            RestApiId:
              Ref: IntegrationApi
            Path: /internal/v1/stripe/product-presentation
            Method: post
            Auth:
              Authorizer: AWS_IAM

  InternalStripeDiscountFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.internal_stripe_discount.lambda_handler
      Role:
        Fn::GetAtt: [InternalProviderCommandRole, Arn]
      LoggingConfig: *ControlPlaneLogging
      Events:
        InternalCommand:
